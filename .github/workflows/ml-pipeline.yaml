name: ML Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com
      
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Pull DVC data
        run: |
          dvc pull

      - name: Start temporary MLflow server
        run: |
          nohup mlflow server \
            --host 127.0.0.1 \
            --port 5001 \
            --workers 1
            --backend-store-uri sqlite:///mlflow-ci.db \
            --artifacts-destination ./mlflow-ci-artifacts \
            --allowed-hosts "127.0.0.1:5001, localhost:5001" \
            </dev/null > mlflow-server.log 2>&1 &
          echo $! > mlflow-server.pid
          echo "MLflow server started with PID $(cat mlflow-server.pid)"

      - name: Wait for MLflow
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:5001/ > /dev/null; then
              echo "MLflow is ready"
              exit 0
            fi

            echo "Waiting for MLflow..."
            sleep 2
          done

          echo "MLflow failed to start"
          cat mlflow-server.log
          exit 1

      - name: Run ML pipeline
        env:
          MLFLOW_TRACKING_URL: http://127.0.0.1:5001
        run: |
          dvc repro --dorce train evaluate
