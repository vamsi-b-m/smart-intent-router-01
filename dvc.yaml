stages:
  prepare:
    cmd: python src/data/prepare.py
    deps:
      - src/data/prepare.py
      - data/raw
    outs:
      - data/processed

  train:
    cmd: python src/train/train.py
    deps:
      - src/train/train.py
      - data/processed/train.csv
      - data/processed/validation.csv
    outs:
      - models/intent_classifier.joblib
      - models/mlflow_run_id.txt
    
  evaluate:
    cmd: python src/evaluate/evaluate.py
    deps:
      - src/evaluate/evaluate.py
      - models/intent_classifier.joblib
      - data/processed/test.csv
    outs:
      - models/metrics.json

  register:
    cmd: python src/register/register.py
    deps:
      - src/register/register.py
      - models/mlflow_run_id.txt
      - models/metrics.json
    outs:
      - models/registered_model_version.txt
